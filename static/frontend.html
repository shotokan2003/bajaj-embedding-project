<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document QA Frontend</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; }
        label { display: block; margin-top: 1em; }
        input, textarea, button, select { margin-top: 0.5em; }
        #answers { margin-top: 2em; }
    </style>
</head>
<body>
    <h2>Upload Document and Ask a Question</h2>
    <form id="uploadForm">
        <label>PDF File:
            <input type="file" id="fileInput" accept="application/pdf" required />
        </label>
        <button type="submit">Upload</button>
    </form>
    <div id="uploadStatus"></div>
    <form id="queryForm" style="display:none;">
        <label>Select uploaded document:
            <select id="docSelect"></select>
        </label>
        <label>Enter your question(s) (one per line):
            <textarea id="questionInput" rows="6" cols="60" required></textarea>
        </label>
        <button type="submit">Ask</button>
    </form>
    <div id="answers"></div>
    <script>
        const uploadForm = document.getElementById('uploadForm');
        const queryForm = document.getElementById('queryForm');
        const uploadStatus = document.getElementById('uploadStatus');
        const answersDiv = document.getElementById('answers');
        const docSelect = document.getElementById('docSelect');
        let apiKey = '';
        let uploadedDocs = [];

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            apiKey = prompt('Enter your API key (for Authorization header):');
            if (!apiKey) { alert('API key required!'); return; }
            const formData = new FormData();
            formData.append('files', file);
            uploadStatus.textContent = 'Uploading and processing...';
            answersDiv.textContent = '';
            try {
                const resp = await fetch('/api/v1/hackrx/upload', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + apiKey },
                    body: formData
                });
                const data = await resp.json();
                if (resp.ok) {
                    uploadStatus.textContent = 'Upload successful! Now enter your question(s).';
                    queryForm.style.display = '';
                    // Store uploaded document IDs and filenames
                    uploadedDocs = data.document_ids.map((id, i) => ({ id, name: data.filenames[i] }));
                    docSelect.innerHTML = uploadedDocs.map(doc => `<option value="${doc.id}">${doc.name}</option>`).join('');
                } else {
                    uploadStatus.textContent = 'Upload failed: ' + (data.detail || JSON.stringify(data));
                }
            } catch (err) {
                uploadStatus.textContent = 'Error: ' + err;
            }
        });

        queryForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!uploadedDocs.length) {
                alert('Please upload a document first.');
                return;
            }
            const questions = document.getElementById('questionInput').value
                .split('\n').map(q => q.trim()).filter(q => q);
            if (!questions.length) {
                alert('Please enter at least one question.');
                return;
            }
            const document_id = docSelect.value;
            const resp = await fetch('/hackrx/run', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json',
                    'Authorization': 'Bearer ' + apiKey
                },
                body: JSON.stringify({
                    document_id: document_id,
                    questions: questions
                })
            });
            const data = await resp.json();
            if (resp.ok) {
                answersDiv.innerHTML = '<b>Answers:</b><br>' + data.answers.map(a => `<div>• ${a}</div>`).join('');
            } else {
                answersDiv.textContent = 'Query failed: ' + (data.detail || JSON.stringify(data));
            }
        });
    </script>
</body>
</html>
